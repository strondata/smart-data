name: Code Hygiene Scan (CHORE-002)

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 02:00 UTC
  workflow_dispatch:      # Allows manual triggering

jobs:
  hygiene-scan:
    name: Run Continuous Code Hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install Dependencies
        run: poetry install --with dev

      - name: Setup Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare clean branch
        run: |
          git checkout main
          git branch -D clean || true
          git checkout -b clean

      - name: Run aptdata mesh clean
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          poetry run aptdata mesh clean --json > /tmp/hygiene_report.json
          # Execute auto-fix with ruff to actually remove unused imports/variables
          poetry run ruff check --select=F401,F841 --fix . || true

      - name: Commit and Push Changes
        id: commit_push
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore(hygiene): remove unused code and dead imports"
            git push -f origin clean
            echo "changes_made=true" >> $GITHUB_OUTPUT
          else
            echo "No changes needed."
            echo "changes_made=false" >> $GITHUB_OUTPUT
          fi

      - name: Open or Update Pull Request
        if: steps.commit_push.outputs.changes_made == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if an open PR from clean to main already exists
          PR_EXISTS=$(gh pr list --base main --head clean --state open --json number --jq 'length')

          if [ "$PR_EXISTS" -eq "0" ]; then
            # We dynamically load the project's PULL_REQUEST_TEMPLATE
            TEMPLATE_BODY=$(cat .github/PULL_REQUEST_TEMPLATE.md)

            # Extract findings count from the JSON lines output
            FINDINGS_COUNT=$(grep '"event": "mesh.clean.completed"' /tmp/hygiene_report.json | jq -r '.count' || echo '0')
            SUMMARY="This PR was automatically generated by the Code Hygiene Action.\nIt removed dead code, unused variables, and unused imports via static analysis (Ruff & Vulture) and LLM cross-referencing with docs/.\n\nTotal findings: **$FINDINGS_COUNT**"

            # Inject summary into the template description
            # Replacing the HTML comment for the description with our summary
            PR_BODY=$(echo "$TEMPLATE_BODY" | sed "s|<!-- A clear and concise description of what this PR changes and why. -->|$SUMMARY|g")

            # Check off the appropriate checkboxes
            PR_BODY=$(echo "$PR_BODY" | sed "s|- \[ \] 🔧 Chore / maintenance (CI, tooling, dependencies)|- [x] 🔧 Chore / maintenance (CI, tooling, dependencies)|g")
            PR_BODY=$(echo "$PR_BODY" | sed "s|- \[ \] ♻️ Refactor (no functional changes)|- [x] ♻️ Refactor (no functional changes)|g")
            PR_BODY=$(echo "$PR_BODY" | sed "s|- \[ \] I have run \`make lint\` and there are no linting errors|- [x] I have run \`make lint\` and there are no linting errors|g")
            PR_BODY=$(echo "$PR_BODY" | sed "s|- \[ \] I have run \`make test\` and all tests pass|- [x] I have run \`make test\` and all tests pass|g")

            gh pr create \
              --title "🧹 CHORE-002: Continuous Code Hygiene (Auto-PR)" \
              --body "$PR_BODY" \
              --base main \
              --head clean
          else
            echo "PR already exists, updated with new commits."
          fi

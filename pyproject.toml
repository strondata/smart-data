[tool.poetry]
name = "aptdata"
version = "0.0.3"
description = "A declarative, extensible framework for building smart data pipelines in Python"
authors = ["strondata"]
license = "MIT"
readme = "README.md"
homepage = "https://strondata.github.io/smart-data"
repository = "https://github.com/strondata/smart-data"
documentation = "https://strondata.github.io/smart-data"
keywords = ["data-pipeline", "framework", "etl", "pydantic", "data-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
packages = [{include = "aptdata"}]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.0"
typer = {extras = ["all"], version = "^0.15"}
rich = "^13.0"
textual = "^0.60"
pyyaml = "^6.0"
opentelemetry-api = "^1.40.0"
opentelemetry-sdk = "^1.40.0"
mcp = {version = "^1.26.0", optional = true}
python-dotenv = "^1.0"
questionary = ">=2.0"
pandas = {version = "^2.2", optional = true}
pyspark = {version = "^3.5", optional = true}
httpx = {version = "^0.27", optional = true}
sqlalchemy = {version = "^2.0", optional = true}
psycopg2-binary = {version = "^2.9", optional = true}
pyarrow = {version = "^15.0", optional = true}
types-psutil = "^7.2.2.20260130"
types-pyyaml = "^6.0.12.20250915"

[tool.poetry.extras]
pandas = ["pandas"]
spark = ["pyspark"]
plugins = ["httpx", "sqlalchemy", "psycopg2-binary", "pyarrow"]
ai = ["mcp"]
all = ["pandas", "pyspark", "httpx", "sqlalchemy", "psycopg2-binary", "pyarrow", "mcp"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
ruff = "^0.4"
mkdocs = "^1.6"
mkdocs-material = "^9.5"
mkdocstrings = {extras = ["python"], version = "^0.25"}
pytest-asyncio = "^1.3.0"
bump-my-version = "^0.20.0"

[tool.poetry.scripts]
aptdata = "aptdata.cli.app:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["aptdata"]
omit = [
    "aptdata/plugins/transform/spark.py",
    "aptdata/plugins/transform/pandas.py",
    "aptdata/plugins/postgres.py",
    "aptdata/mcp/server.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

site_name: aptdata
site_description: A declarative framework for building smart data pipelines
site_url: https://strondata.github.io/smart-data
repo_url: https://github.com/strondata/smart-data
repo_name: strondata/smart-data
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tabs.link
    - search.suggest
    - search.highlight
    - navigation.footer

  font:
    text: Inter
    code: JetBrains Mono

  icon:
    repo: fontawesome/brands/github

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - assets/termynal.js

copyright: Copyright &copy; 2024 Strondata - Mantido pela comunidade open source.

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/strondata/smart-data
      name: Repositório Oficial do aptdata
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/strondata/
      name: Acompanhe a Strondata no LinkedIn
    - icon: fontawesome/brands/discord
      link: https://discord.gg/strondata
      name: Junte-se à Comunidade no Discord

extra_css:
  - stylesheets/extra.css
  - stylesheets/custom.css
  - stylesheets/termynal.css

plugins:
  - search
  - autorefs:
      link_titles: auto
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true
            members_order: source
            docstring_style: numpy

nav:
  - Getting Started:
      - Home: index.md
      - Overview: getting-started.md
      - Scaffold Templates: scaffold-templates.md
      - Configuration: configuration.md
      - DIYs & Snippets: diys.md
  - Core:
      - Architecture: architecture.md
      - ADR 001 - Revisão Core: ADR-001-Revisao-Arquitetural-Core.md
      - Quality: quality.md
      - Governance: governance.md
      - Telemetry: telemetry.md
      - CI & Execution Logs: ci-logs.md
  - Plugins:
      - Engines: transform-engines.md
      - MCP Server: mcp.md
      - AI Docs:
          - llms.txt: llms.txt
          - llms-full.txt: llms-full.txt
          - Docs Agent Prompts: prompts/docs-agent.md
  - API:
      - Core Reference: api/core.md
      - CLI: api/cli.md
      - CLI Interactive: api/cli-interactive.md
      - Plugins Reference: api/plugins.md
      - Changelog: changelog.md

markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

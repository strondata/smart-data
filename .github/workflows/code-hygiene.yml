name: Daily Code Hygiene

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:      # Manual trigger

jobs:
  hygiene:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pip install poetry==1.7.1

      - name: Install dependencies
        run: poetry install

      - name: Install tools
        run: poetry run pip install vulture

      - name: Run QAAgent (mesh lint)
        run: |
          poetry run aptdata mesh lint --deep --json > /tmp/report.jsonl || true
          cat /tmp/report.jsonl

      - name: Run Auto-Fixes (vulture / ruff)
        run: |
          # The agent would typically run these auto-fixes, we can use ruff check --fix
          poetry run ruff check --fix aptdata/ tests/ || true
          # Find dead code with vulture (output outside repo)
          poetry run vulture aptdata/ tests/ --min-confidence 100 > /tmp/dead_code.txt || true

      - name: Create PR with fixes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git diff-index --quiet HEAD --; then
            echo "No changes to commit"
            exit 0
          fi

          # Check if there's already an open PR from clean branch
          EXISTING_PR=$(gh pr list --state open --head clean --json number --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
             echo "Updating existing clean branch"
             git checkout clean
             git add .
             git commit -m "chore: automated code hygiene and dead code removal updates"
             git push origin clean
          else
             echo "Creating new clean branch PR"
             git checkout -b clean
             git add .
             git commit -m "chore: automated code hygiene and dead code removal"
             git push -u origin clean

             PR_TITLE="🛡️ Automated Code Hygiene Fixes"
             PR_BODY="This PR was auto-generated by the daily code hygiene workflow. It includes PEP8 fixes, docstring formatting, and dead code cleanup.\n\nPlease review the changes before merging."

             gh pr create --title "$PR_TITLE" --body "$PR_BODY" --base main --head clean
          fi

name: Code Hygiene & Tech Debt Reduction

on:
  schedule:
    - cron: '0 3 * * *'  # Runs daily at 3:00 AM UTC
  workflow_dispatch:      # Allows manual trigger via UI

permissions:
  contents: write
  pull-requests: write

jobs:
  run-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --with dev

      - name: Setup Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout clean branch
        run: |
          if git ls-remote --heads origin clean | grep clean; then
            git fetch origin clean
            git checkout clean
            git merge main --no-edit || true
          else
            git checkout -b clean
          fi

      - name: Run QAAgent (mesh clean)
        id: run-qa
        run: |
          poetry run aptdata mesh clean --deep --json > qa_report.json
          cat qa_report.json

      - name: Check for changes
        id: check-changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changes=true" >> $GITHUB_ENV
          else
            echo "changes=false" >> $GITHUB_ENV
          fi

      - name: Commit removals to clean branch
        if: env.changes == 'true'
        run: |
          git add .
          git commit -m "chore(qa): auto-clean dead code and formatting [skip ci]"
          git push origin clean

      - name: Open Pull Request
        if: env.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_EXISTS=$(gh pr list --base main --head clean --json number --jq 'length')

          # Parse report items and construct details
          REMOVED_ITEMS=$(jq -r '.items_removed[] | "- \(.type) `\(.name)` in `\(.filepath)` (lines \(.lines))"' qa_report.json 2>/dev/null || echo "- Could not parse removed items.")
          SEMANTIC_ISSUES=$(jq -r '.semantic_deviations[] | "- \(.type): `\(.name)` in `\(.filepath)`"' qa_report.json 2>/dev/null || echo "- Could not parse semantic deviations.")

          REPORT_MD="Automated PR generated by the QA Agent to remove dead code, unused imports, and format the codebase.\n\n### Items Removed:\n$REMOVED_ITEMS\n\n### Semantic Deviations:\n$SEMANTIC_ISSUES"

          # Read PR template and create a PR body
          BODY=$(awk -v r="$REPORT_MD" '{gsub(/<!-- A clear and concise description of what this PR changes and why. -->/, r)}1' .github/PULL_REQUEST_TEMPLATE.md)

          if [ "$PR_EXISTS" -eq "0" ]; then
            gh pr create \
              --base main \
              --head clean \
              --title "🧹 chore: automated code hygiene fixes" \
              --body "$BODY" \
              --label "chore"
          else
            echo "PR already exists. Branch updated."
          fi

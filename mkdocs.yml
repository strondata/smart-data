site_name: aptdata
site_description: A declarative framework for building smart data pipelines
site_url: https://strondata.github.io/smart-data
repo_url: https://github.com/strondata/smart-data
repo_name: strondata/smart-data
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tabs.link
    - search.suggest
    - search.highlight
    - navigation.footer

  font:
    text: Inter
    code: JetBrains Mono

  icon:
    repo: fontawesome/brands/github

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - assets/termynal.js

copyright: Copyright &copy; 2024 Strondata - Mantido pela comunidade open source.

extra:
  version:
    provider: mike
  analytics:
    feedback:
      title: Esta página foi útil?
      ratings:
        - icon: material/emoticon-happy-outline
          name: Sim, foi útil
          data: 1
          note: Obrigado pelo feedback!
        - icon: material/emoticon-sad-outline
          name: Não, precisa melhorar
          data: 0
          note: Obrigado. Vamos usar este feedback para melhorar a documentação.
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/strondata/smart-data
      name: Repositório Oficial do aptdata
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/strondata/
      name: Acompanhe a Strondata no LinkedIn
    - icon: fontawesome/brands/discord
      link: https://discord.gg/strondata
      name: Junte-se à Comunidade no Discord

extra_css:
  - stylesheets/extra.css
  - stylesheets/custom.css
  - stylesheets/termynal.css

plugins:
  - search:
      lang: pt
  - tags
  - social
  - autorefs:
      link_titles: auto
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true
            members_order: source
            docstring_style: numpy

nav:
  - Home: index.md
  - Tutoriais:
      - Getting Started: getting-started.md
      - Scaffold Templates: scaffold-templates.md
  - Guias (Como Fazer):
      - Integrações e Engines: transform-engines.md
      - Servidor MCP para IAs: mcp.md
      - Snippets de Código Úteis: diys.md
      - Configuração: configuration.md
  - Explicações (Conceitos):
      - Arquitetura: architecture.md
      - Qualidade de Dados: quality.md
      - Governança de Dados: governance.md
      - Telemetria e Logs: telemetry.md
      - CI & Logs de Execução: ci-logs.md
      - ADR 001 - Revisão Core: ADR-001-Revisao-Arquitetural-Core.md
  - Referência (API):
      - API do Core: api/core.md
      - API de Plugins: api/plugins.md
      - CLI Reference: api/cli.md
      - CLI Interativa: api/cli-interactive.md
  - Comunidade:
      - Changelog: changelog.md
      - Contribuindo: CONTRIBUTING.md
  - AI Docs:
      - llms.txt: llms.txt
      - llms-full.txt: llms-full.txt
      - Docs Agent Prompts: prompts/docs-agent.md

markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

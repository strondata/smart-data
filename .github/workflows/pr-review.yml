name: PR Review - QA/DX Agent

on:
  pull_request:
    branches:
      - main

jobs:
  qa-dx-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install ruff mypy pydocstyle
          pip install poetry
          poetry install

      - name: Run QA/DX Agent
        id: run_agent
        run: |
          poetry run aptdata mesh lint --deep --json > qa_report.json
        continue-on-error: true

      - name: Parse and Create PR Review
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const lines = fs.readFileSync('qa_report.json', 'utf-8').trim().split('\n');
              let reportJson = null;
              for (const line of lines) {
                const parsed = JSON.parse(line);
                if (parsed.event === 'mesh.lint.completed') {
                   reportJson = parsed.report;
                   break;
                }
              }

              if (reportJson) {
                let body = `### 🤖 QA/DX Agent Report\n\n`;
                body += `**Repo Health Score:** ${reportJson.score_repo_health}/100\n`;
                body += `**Docstring Score:** ${reportJson.score_docstring}/100\n\n`;

                if (reportJson.architectural_violations.length > 0) {
                   body += `#### 🚨 Architectural Violations\n`;
                   for (const v of reportJson.architectural_violations) {
                     body += `- ${v}\n`;
                   }
                   body += `\n`;
                }

                if (reportJson.test_coverage_issues && reportJson.test_coverage_issues.length > 0) {
                   body += `#### 🧪 Missing Tests\n`;
                   for (const t of reportJson.test_coverage_issues) {
                     body += `- ${t}\n`;
                   }
                   body += `\n`;
                }

                if (reportJson.complexity_warnings && reportJson.complexity_warnings.length > 0) {
                   body += `#### 🧩 Cyclomatic Complexity\n`;
                   for (const c of reportJson.complexity_warnings) {
                     body += `- \`${c}\`\n`;
                   }
                   body += `\n`;
                }

                if (reportJson.semantic_reviews && reportJson.semantic_reviews.length > 0) {
                   body += `#### 🧠 Semantic Review (LLM)\n`;
                   for (const r of reportJson.semantic_reviews) {
                     body += `- ${r}\n`;
                   }
                   body += `\n`;
                }

                if (reportJson.orphaned_commands.length > 0) {
                   body += `#### ⚠️ Orphaned Makefile Targets (Undocumented)\n`;
                   for (const cmd of reportJson.orphaned_commands) {
                     body += `- \`${cmd}\`\n`;
                   }
                   body += `\n`;
                }

                body += `**Summary:** ${reportJson.summary}`;

                // Create a PR Review instead of an Issue Comment
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  event: 'COMMENT',
                  body: body
                });

                if (reportJson.architectural_violations.length > 0) {
                  core.setFailed("Architectural violations detected by QA/DX Agent.");
                }
              }
            } catch (err) {
              console.log("Could not parse QA report.", err);
            }

      - name: Auto-Fix Linting Issues (Ruff)
        run: |
          ruff check --fix aptdata/ tests/
        continue-on-error: true

      - name: Create Corrective PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(qa): auto-fix code hygiene issues via QA/DX Agent"
          branch: "qa-fixes-${{ github.event.pull_request.number }}"
          title: "🤖 QA/DX Agent: Auto-fixes for PR #${{ github.event.pull_request.number }}"
          body: "Automated code hygiene improvements generated by the QA/DX Agent."
          base: main
